<!DOCTYPE html>
<!DOCTYPE html>
<html lang="es">

<head>
<style>
    * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Trebuchet MS', sans-serif;
    background: linear-gradient(
        120deg,
        #e1f2ff,
        #f8e3ff,
        #ffe2f3
    );
    padding: 20px;
    color: #401879;
}

/* BARRA SUPERIOR */

.navbar {
    background: linear-gradient(90deg, #9162d5, #bd83d9);
    padding: 18px 35px;
    border-radius: 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 15px;
    box-shadow: 0 4px 12px #c9a5e6;
    margin-bottom: 20px;
}

.logo {
    display: flex;
    align-items: center;
    gap: 12px;
    color: white;
}

.logo h2 {
    font-size: 23px;
}

.simbolos {
    font-size: 30px;
}

.flor-logo {
    font-size: 40px;
}

.menu {
    display: flex;
    align-items: center;
    gap: 20px;
    flex-wrap: wrap;
}

.menu a {
    color: white;
    text-decoration: none;
    font-weight: bold;
    transition: 0.3s;
}

.menu a:hover {
    color: #ffe1f3;
    transform: translateY(-3px);
}

.menu span {
    font-size: 25px;
    color: #35145e;
}


/* CONTENEDOR PRINCIPAL */

.contenedor {
    min-height: 780px;
    position: relative;
    overflow: hidden;
    border: 2px solid #d5a4ed;
    border-radius: 25px;
    background: linear-gradient(
        120deg,
        #d9efff,
        #fff0fa,
        #f9dff5
    );
    padding: 45px 20px;
    text-align: center;
    box-shadow: 0 5px 15px #d9bce8;
}


/* TÍTULO */

.titulo {
    font-family: Georgia, serif;
    font-size: 75px;
    color: #40147c;
    margin: 5px 0 25px;
    text-shadow: 2px 2px 3px #e5c5ff;
}

.subtitulo {
    font-size: 30px;
    font-weight: bold;
    color: #51228c;
    margin-bottom: 45px;
}


/* TARJETA PRINCIPAL */

.tarjeta {
    width: 80%;
    max-width: 950px;
    min-height: 325px;
    margin: auto;
    padding: 30px;
    border: 2px dashed #ce91f2;
    border-radius: 40px;
    background: linear-gradient(
        120deg,
        #f8e3ff,
        #f5ddff,
        #fce5f7
    );
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 25px;
    position: relative;
    z-index: 2;
}


/* FLOR DE LA TARJETA */

.flor-tarjeta {
    font-size: 120px;
    filter: drop-shadow(2px 3px 3px #d7a1e4);
}


/* TEXTO */

.contenido {
    max-width: 550px;
}

.contenido p {
    font-size: 26px;
    line-height: 1.6;
    font-weight: bold;
    color: #6532a1;
}


/* BOTÓN */

.botones {
    width: 100%;
    margin-top: 5px;
}

.boton {
    display: inline-block;
    background: linear-gradient(
        90deg,
        #8150c9,
        #a47add
    );
    color: white;
    text-decoration: none;
    padding: 20px 55px;
    border-radius: 45px;
    font-size: 23px;
    font-weight: bold;
    box-shadow: 0 5px 10px #c7a1e9;
    transition: 0.3s;
}

.boton:hover {
    transform: scale(1.08);
    background: #7040b5;
}


/* DECORACIONES */

.decoracion {
    position: absolute;
    z-index: 1;
}

.estrella1 {
    top: 65px;
    left: 5%;
    font-size: 45px;
}

.estrella2 {
    top: 35px;
    right: 5%;
    font-size: 40px;
}

.estrella3 {
    bottom: 30%;
    left: 3%;
    font-size: 45px;
}

.estrella4 {
    bottom: 15%;
    right: 10%;
    font-size: 45px;
}

.tulipan1 {
    top: 28%;
    left: 3%;
    font-size: 75px;
}

.tulipan2 {
    top: 27%;
    right: 3%;
    font-size: 75px;
}

.tulipan3 {
    bottom: 10%;
    left: 4%;
    font-size: 65px;
}

.flor1 {
    top: 5%;
    right: 9%;
    font-size: 75px;
}

.flor2 {
    bottom: 28%;
    left: 9%;
    font-size: 55px;
}


/* NUBES */

.nube {
    position: absolute;
    width: 180px;
    height: 65px;
    background: #e9caff;
    border-radius: 50px;
    opacity: 0.65;
    bottom: -35px;
    z-index: 0;
}

.nube::before,
.nube::after {
    content: "";
    position: absolute;
    background: #e9caff;
    border-radius: 50%;
}

.nube::before {
    width: 95px;
    height: 95px;
    top: -40px;
    left: 20px;
}

.nube::after {
    width: 75px;
    height: 75px;
    top: -25px;
    left: 85px;
}

.nube1 {
    left: -30px;
}

.nube2 {
    right: -30px;
    background: #f5c8ec;
}

.nube2::before,
.nube2::after {
    background: #f5c8ec;
}


/* FLOR GRANDE INFERIOR */

.flor-grande {
    position: absolute;
    bottom: -75px;
    right: -35px;
    font-size: 190px;
    opacity: 0.75;
    z-index: 1;
}


/* ADAPTACIÓN A CELULARES */

@media (max-width: 750px) {

    body {
        padding: 10px;
    }

    .navbar {
        justify-content: center;
        padding: 15px;
    }

    .menu {
        justify-content: center;
        gap: 12px;
        font-size: 13px;
    }

    .titulo {
        font-size: 45px;
    }

    .subtitulo {
        font-size: 20px;
    }

    .tarjeta {
        width: 95%;
        padding: 20px;
    }

    .flor-tarjeta {
        font-size: 85px;
    }

    .contenido p {
        font-size: 19px;
    }

    .boton {
        font-size: 17px;
        padding: 15px 25px;
    }

    .flor-grande {
        font-size: 100px;
    }

    .decoracion {
        opacity: 0.55;
    }
}
/* PETALOS CAYENDO */
.petalo {
    position: fixed;
    top: -50px;
    z-index: 1000;
    pointer-events: none;
    font-size: 23px;
    animation: caer linear infinite;
}

@keyframes caer {
    0% {
        transform: translateY(-50px) rotate(0deg);
        opacity: 0;
    }

    10% {
        opacity: 1;
    }

    90% {
        opacity: 1;
    }

    100% {
        transform: translateY(110vh) rotate(360deg);
        opacity: 0;
    }
}
/* ESTRELLITAS CAYENDO */
.estrellita {
    position: fixed;
    top: -40px;
    z-index: 1000;
    pointer-events: none;
    color: #ffbb00;
    font-size: 22px;
    text-shadow: 0 0 8px #ffc800;
    animation: caerEstrella linear infinite;
}

@keyframes caerEstrella {
    0% {
        transform: translateY(-40px) rotate(0deg);
        opacity: 0;
    }

    15% {
        opacity: 1;
    }

    85% {
        opacity: 1;
    }

    100% {
        transform: translateY(110vh) rotate(360deg);
        opacity: 0;
    }
}
</style>
